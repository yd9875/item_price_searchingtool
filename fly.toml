app = "yd9875-item-price-searchingtool"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  OPENAI_MODEL = "gpt-5.6-sol"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
